<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 프레임</title>
<style>
  body{margin:0;background:#e8edf2;display:grid;place-items:center;min-height:100vh;font-family:sans-serif}
  .phone{width:375px;height:812px;background:#fff;border-radius:40px;box-shadow:0 20px 60px rgba(0,0,0,.18);padding:12px;box-sizing:border-box}
  iframe{width:100%;height:100%;border:0;border-radius:30px}
</style>
</head>
<body>
<div class="phone"><iframe id="f"></iframe></div>
<script>document.getElementById('f').src = new URLSearchParams(location.search).get('src') || 'main.html';</script>
</body>
</html>
