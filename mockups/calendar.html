<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학교일정표 (목업)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>tailwind.config={theme:{extend:{colors:{forest:{50:'#effaf3',100:'#d7f0e2',500:'#2f9e6e',600:'#25855a',700:'#1d6845'}},fontFamily:{sans:['Pretendard','sans-serif']}}}}</script>
</head>
<body class="bg-white text-slate-800 font-sans">

<header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-100">
  <div class="max-w-6xl mx-auto px-4 h-14 lg:h-16 flex items-center gap-3">
    <button class="lg:hidden p-2 -ml-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a href="main.html" class="flex items-center gap-2 font-bold text-forest-700 text-lg"><span class="w-8 h-8 rounded-xl bg-forest-600 text-white grid place-items-center">숲</span><span class="hidden sm:block">푸른숲발도르프학교</span></a>
    <div class="ml-auto"><span class="w-7 h-7 rounded-full bg-forest-100 text-forest-700 grid place-items-center text-xs font-bold inline-flex">신</span></div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 pb-16">
  <div class="mt-6 mb-4 flex items-center gap-3">
    <div><p class="text-xs text-slate-400 mb-0.5">학교소식</p><h1 class="text-2xl font-bold">학교일정표</h1></div>
    <div class="ml-auto flex items-center gap-2">
      <div class="flex rounded-xl bg-slate-100 p-1 text-sm font-medium">
        <button class="px-3 py-1 rounded-lg bg-white shadow-sm">월</button>
        <button class="px-3 py-1 rounded-lg text-slate-500">목록</button>
      </div>
      <a href="write.html" class="hidden sm:block bg-forest-600 text-white text-sm font-medium px-4 py-2 rounded-xl">일정 등록</a>
    </div>
  </div>

  <div class="grid lg:grid-cols-[1fr_320px] gap-6">
    <!-- 월 캘린더 -->
    <section>
      <div class="flex items-center justify-center gap-4 mb-3 font-bold text-lg">
        <button class="text-slate-300 px-2">◀</button> 2026년 6월 <button class="text-slate-300 px-2">▶</button>
      </div>
      <div class="grid grid-cols-7 text-center text-xs text-slate-400 font-medium mb-1">
        <span class="text-red-400">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-400">토</span>
      </div>
      <div class="grid grid-cols-7 gap-1 text-sm">
        <!-- week rows: dot = 일정 -->
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-slate-300">31</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">1</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">2</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">3</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">4</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 bg-slate-50">5<div class="hidden sm:block mt-1 text-[10px] truncate rounded bg-forest-100 text-forest-700 px-1">전체모임</div><span class="sm:hidden block w-1.5 h-1.5 rounded-full bg-forest-500 mx-auto mt-1"></span></div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-blue-500">6</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-red-400">7</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">8</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">9</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">10</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">11</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 ring-2 ring-forest-500 bg-forest-50 font-bold">12<div class="hidden sm:block mt-1 text-[10px] truncate rounded bg-forest-600 text-white px-1">요가 클래스</div><span class="sm:hidden block w-1.5 h-1.5 rounded-full bg-forest-500 mx-auto mt-1"></span></div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-blue-500">13</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-red-400">14</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 bg-slate-50">15<div class="hidden sm:block mt-1 text-[10px] truncate rounded bg-forest-100 text-forest-700 px-1">운영위 회의</div><span class="sm:hidden block w-1.5 h-1.5 rounded-full bg-forest-500 mx-auto mt-1"></span></div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">16</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">17</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">18</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">19</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-blue-500 bg-slate-50">20<div class="hidden sm:block mt-1 text-[10px] truncate rounded bg-amber-100 text-amber-700 px-1">여름방학식</div><span class="sm:hidden block w-1.5 h-1.5 rounded-full bg-amber-400 mx-auto mt-1"></span></div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-red-400">21</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">22</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">23</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">24</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">25</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">26</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-blue-500">27</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-red-400">28</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">29</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5">30</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-slate-300">1</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-slate-300">2</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-slate-300">3</div>
        <div class="aspect-square sm:aspect-[4/3] rounded-xl p-1.5 text-slate-300">4</div>
      </div>
    </section>

    <!-- 선택일 상세 (D: 우측 패널 / M: 하단 리스트) -->
    <aside class="lg:border-l lg:border-slate-100 lg:pl-6">
      <h2 class="font-bold mb-3">6월 12일 (금)</h2>
      <ul class="space-y-3">
        <li class="rounded-2xl border border-slate-100 p-4">
          <p class="text-xs font-semibold text-forest-600 mb-1">14:00 – 16:00</p>
          <a href="post.html" class="font-medium hover:text-forest-700">요가 클래스 (12학년 졸업프로젝트)</a>
          <p class="mt-1 text-xs text-slate-400">장소: 강당 · 작성 12학년</p>
        </li>
      </ul>
      <a href="write.html" class="sm:hidden mt-4 block text-center bg-forest-600 text-white text-sm font-medium py-3 rounded-2xl">+ 일정 등록</a>
    </aside>
  </div>
</main>
</body>
</html>
