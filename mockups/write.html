<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글쓰기 (목업)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script>tailwind.config={theme:{extend:{colors:{forest:{50:'#effaf3',100:'#d7f0e2',500:'#2f9e6e',600:'#25855a',700:'#1d6845'}},fontFamily:{sans:['Pretendard','sans-serif']}}}}</script>
</head>
<body class="bg-white text-slate-800 font-sans">

<!-- 상단 고정바 -->
<header class="sticky top-0 z-40 bg-white border-b border-slate-100">
  <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
    <a href="board-list.html" class="text-slate-400 text-sm">✕ 취소</a>
    <p class="font-bold">글쓰기 <span class="text-xs font-normal text-slate-400">— 알려드립니다</span></p>
    <button class="bg-forest-600 text-white text-sm font-semibold px-4 py-1.5 rounded-xl">등록</button>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 pb-16">
  <input class="w-full mt-5 text-xl font-bold placeholder-slate-300 focus:outline-none" placeholder="제목을 입력하세요">

  <!-- 에디터 툴바 (최소화) -->
  <div class="mt-4 sticky top-14 z-30 bg-white border border-slate-200 rounded-xl px-2 py-1.5 flex items-center gap-1 text-sm text-slate-500">
    <button class="w-8 h-8 rounded-lg hover:bg-slate-50 font-bold">B</button>
    <button class="w-8 h-8 rounded-lg hover:bg-slate-50 italic font-serif">I</button>
    <span class="w-px h-5 bg-slate-100 mx-1"></span>
    <button class="w-8 h-8 rounded-lg hover:bg-slate-50">🔗</button>
    <button class="w-8 h-8 rounded-lg hover:bg-slate-50">🖼️</button>
    <button class="w-8 h-8 rounded-lg hover:bg-slate-50">≡</button>
    <span class="ml-auto text-[11px] text-slate-300">임시저장됨 · 방금 전</span>
  </div>

  <!-- 본문 영역 -->
  <div class="mt-3 min-h-[320px] text-[15px] leading-relaxed text-slate-700">
    <p>안녕하세요, 운영위원회입니다.</p>
    <p class="mt-3">지난 6월 5일 진행된 학부모 전체모임의 주요 결과를 공유드립니다.</p>
    <p class="mt-3 text-slate-300">| (커서)</p>
  </div>

  <!-- 첨부 -->
  <section class="mt-6 border-t border-slate-100 pt-4">
    <p class="text-sm font-semibold mb-3">파일 첨부 <span class="text-slate-400 font-normal">1/10</span></p>
    <div class="flex flex-wrap gap-2">
      <div class="flex items-center gap-2 bg-slate-50 rounded-xl pl-3 pr-2 py-2 text-sm">
        📄 <span class="max-w-[180px] truncate">회의록.pdf</span>
        <button class="w-5 h-5 grid place-items-center rounded-full bg-slate-200 text-slate-500 text-xs">✕</button>
      </div>
      <!-- 모바일: 카메라/앨범 직접 호출 -->
      <button class="flex items-center gap-1.5 border-2 border-dashed border-slate-200 rounded-xl px-4 py-2 text-sm text-slate-400 hover:border-forest-200 hover:text-forest-600">
        + 추가 <span class="sm:hidden">(📷 카메라 · 🖼 앨범 · 📁 파일)</span>
      </button>
    </div>
    <p class="mt-2 text-xs text-slate-400">이미지는 자동으로 리사이즈되어 업로드됩니다 (장변 1600px)</p>
  </section>
</main>
</body>
</html>
