# 로컬 개발용 인프라 — Postgres 17(RDS와 같은 메이저) + MinIO(S3 호환 미디어 저장소).
#   npm run db:up      컨테이너 기동
#   npm run db:reset   볼륨까지 지우고 다시 기동 + 스키마·시드·샘플 데이터 적용
# 앱은 로컬 호스트에서 `npm run dev` 로 실행한다(컨테이너 안에서 돌리지 않는다). 규칙: db/README.md, README.md
name: gforest

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gforest
      POSTGRES_USER: gforest_admin # RDS 관리자 롤과 같은 이름 — bootstrap_rds.sql 의 default privileges 가 이 이름을 전제
      POSTGRES_PASSWORD: gforest
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db:/db:ro # bootstrap.sh 가 컨테이너 안의 psql 로 이 경로의 SQL 을 적용 (로컬 psql 설치 불필요)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gforest_admin -d gforest"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000" # S3 API — 브라우저의 presigned PUT 도 여기로
      - "127.0.0.1:9001:9001" # 웹 콘솔 (minioadmin / minioadmin)
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 버킷 생성(1회성). 이미 있으면 그냥 끝난다.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/gforest-media-local
      "

  # XE(cafe24) 원본 DB 복제본 — ETL(db/tools/xe) 전용. `docker compose --profile xe up -d xe`
  # db/tools/xe/dump/*.sql.gz 를 최초 기동 때 자동 임포트한다(phpMyAdmin 내보내기 결과, 개인정보 포함 → gitignore).
  xe:
    image: mariadb:10.6
    profiles: ["xe"]
    environment:
      MARIADB_ROOT_PASSWORD: xe
      MARIADB_DATABASE: purunsup7
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max_allowed_packet=256M
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - xe-data:/var/lib/mysql
      - ./db/tools/xe/dump:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  db-data:
  minio-data:
  xe-data:
