# PR 검증: 타입·린트·빌드. 빌드는 DB 없이 통과해야 한다(빌드 시점 DB 접근 금지).
# develop/main push 에도 돌린다 — 자동 생성되는 역병합 PR(main → develop, sync-develop.yml)은 GITHUB_TOKEN 이 만들어
# pull_request 이벤트를 일으키지 않으므로, 같은 커밋의 push 체크가 필수 상태 검사를 채운다.
name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # main 으로의 PR 은 develop(릴리스) 또는 hotfix/* 에서만 — 룰셋 필수 검사(release-guard)
  release-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "${{ github.head_ref }}" in
            develop|hotfix/*) echo "ok: ${{ github.head_ref }} → main" ;;
            *) echo "::error::main 으로의 PR 은 develop 또는 hotfix/* 브랜치에서만 열 수 있습니다 (docs/conventions/branching-and-release.md)"; exit 1 ;;
          esac

  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npx eslint .
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: https://dev.gforest.or.kr
