# Vercel CI 배포 (GFM-26) — Git 연동 자동 배포 대체
# 토큰 기반이라 커밋 author와 무관하게 누구의 push/머지도 배포된다 (Hobby author 차단 우회)
# main push = production / PR = preview (URL을 PR 코멘트로)
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # DB 마이그레이션 적용 — 코드 배포 '전에' prod DB 스키마를 repo와 일치시킨다(GFM-60).
      # supabase/migrations/*.sql 중 schema_migrations에 없는 것만 골라 적용(베이스라인: mig1~8 기적용 표시).
      # push(=production)에서만 — PR preview가 공유 prod DB 스키마를 바꾸면 안 되므로 제외한다.
      # 실패하면 이 잡이 죽어 아래 빌드·배포가 실행되지 않는다(스키마 불일치 배포·드리프트 차단).
      # 필요한 시크릿: SUPABASE_DB_URL = 세션 풀러 연결문자열(비밀번호 percent-encoded)
      #   postgresql://postgres.<ref>:<ENCODED_PW>@aws-1-ap-northeast-2.pooler.supabase.com:5432/postgres
      - name: Supabase CLI 설치
        if: github.event_name == 'push'
        uses: supabase/setup-cli@v1
        with:
          version: 2.106.0
      - name: DB 마이그레이션 적용 (supabase db push)
        if: github.event_name == 'push'
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}" --yes

      - name: Vercel 환경 pull + 빌드
        run: |
          npx vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      # ISR 스모크 게이트 — 배포 '직전'에 prod 빌드(next build → next start)로 글 상세 200을 검증.
      # dev/preview에선 안 잡히고 프로덕션 ISR 런타임에서만 터지는 500(DYNAMIC_SERVER_USAGE 등)을
      # 여기서 막는다. 실패하면 이 스텝에서 잡이 죽어 아래 '배포'가 실행되지 않는다.
      - name: ISR 스모크 게이트 (글 상세 200)
        env:
          SMOKE_PORT: "3100"
        run: |
          # vercel pull이 받은 env를 next build/start가 읽도록 로드
          envfile=$(ls .vercel/.env.*.local 2>/dev/null | head -1 || true)
          if [ -n "$envfile" ]; then set -a; . "$envfile"; set +a; fi
          bash scripts/isr-smoke.sh

      - name: 배포
        id: deploy
        run: |
          url=$(npx vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "배포 URL: $url"

      - name: PR에 preview URL 코멘트
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} -R ${{ github.repository }} \
            --body "🔍 Preview 배포: ${{ steps.deploy.outputs.url }}"

      - name: Discord 알림 (성공)
        if: success() && github.event_name == 'push'
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # 커밋 메시지 첫 줄만, 100자 초과 시 축약. jq로 안전하게 이스케이프(따옴표·백틱 등)
          title=$(printf '%s' "$MSG" | head -n1)
          if [ "${#title}" -gt 100 ]; then title="${title:0:100}…"; fi
          jq -n --arg sha "${GITHUB_SHA:0:7}" --arg msg "$title" \
            '{username:"gforest-bot", content:("✅ **배포 성공** (production) — `" + $sha + "`\n" + $msg)}' \
            | curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" -H "Content-Type: application/json" -d @-

      - name: Discord 알림 (실패)
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" -H "Content-Type: application/json" -d "{
            \"username\": \"gforest-bot\",
            \"content\": \"🚨 **배포 실패** (${{ github.event_name == 'push' && 'production' || 'preview' }}) — \`${GITHUB_SHA:0:7}\`\n로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }"
