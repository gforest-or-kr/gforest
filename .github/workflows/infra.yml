# infra/ 변경 PR 검증: Terraform 형식·문법 + GitHub→AWS OIDC 신뢰가 살아 있는지 확인.
# apply는 CI에서 하지 않는다 — 사람이 로컬(SSO)에서 plan을 눈으로 보고 apply한다.
name: infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yml"]

permissions:
  id-token: write # OIDC 토큰 발급
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"

      - name: terraform fmt / validate (backend 없이)
        run: |
          terraform fmt -check -recursive infra
          for d in infra/*/; do
            echo "== $d"; (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done

      - name: OIDC 토큰 클레임 확인 (디버그)
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$tok" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{iss,aud,sub,repository,repository_owner,ref,event_name}'

      - name: AWS OIDC 신뢰 확인
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: aws sts get-caller-identity
