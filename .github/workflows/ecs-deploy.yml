# 컨테이너 이미지 빌드 → ECR push → ECS Fargate 배포. 규칙: docs/conventions/branching-and-release.md
#  - main push: dev 자동 배포
#  - vX.Y.Z 태그 push: prod 배포 (태그는 Owner만 생성 — 룰셋 protect-release-tags)
#  - 수동 실행(workflow_dispatch): 롤백·재배포 (ref에 이전 태그 선택, environment 지정)
# AWS 자격증명은 OIDC 롤(vars.AWS_DEPLOY_ROLE_ARN)만 사용한다. 장기 키 없음.
name: ecs-deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["docs/**", "infra/**", "mockups/**", "*.md"]
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecs-deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || (inputs.environment || 'dev') }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm # Fargate ARM64와 동일 아키텍처 → QEMU 없이 네이티브 빌드
    timeout-minutes: 25
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || (inputs.environment || 'dev') }}
    env:
      ENV_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || (inputs.environment || 'dev') }}
      SITE_URL: ${{ (startsWith(github.ref, 'refs/tags/v') && 'prod' || (inputs.environment || 'dev')) == 'prod' && 'https://gforest.or.kr' || 'https://dev.gforest.or.kr' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe(태그 기반 버전)용

      - name: 버전 문자열 계산
        id: ver
        run: |
          # 태그가 있으면 v1.2.0 또는 v1.2.0-3-gabc1234, 없으면 0.0.0-gabc1234
          v=$(git describe --tags --always --match 'v*' 2>/dev/null || true)
          case "$v" in v*) ;; *) v="0.0.0-g${v}";; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드·push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.ENV_NAME }}-latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
            APP_VERSION=${{ steps.ver.outputs.version }}
            APP_COMMIT=${{ github.sha }}
            APP_BUILT_AT=${{ steps.ver.outputs.built_at }}
            APP_BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 서비스 갱신 전에 같은 이미지로 `node db/migrate.mjs` 일회성 태스크를 VPC 안에서 실행한다.
      # 실패(종료 코드≠0)하면 여기서 멈추고 서비스는 이전 버전 그대로 남는다. 사람이 RDS 를 열 일이 없다.
      - name: DB 마이그레이션 (VPC 안 일회성 태스크)
        run: |
          set -euo pipefail
          cluster=gforest
          family="gforest-${ENV_NAME}-migrate"
          image="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}"
          aws ecs describe-task-definition --task-definition "$family" --query taskDefinition \
            | jq --arg img "$image" '.containerDefinitions[0].image = $img
                | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' > mtd.json
          marn=$(aws ecs register-task-definition --cli-input-json file://mtd.json --query taskDefinition.taskDefinitionArn --output text)
          net=$(aws ecs describe-services --cluster "$cluster" --services "gforest-${ENV_NAME}" --query 'services[0].networkConfiguration' --output json)
          task=$(aws ecs run-task --cluster "$cluster" --launch-type FARGATE --task-definition "$marn" \
                   --network-configuration "$net" --query 'tasks[0].taskArn' --output text)
          echo "migrate task: $task"
          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task"
          read -r code reason < <(aws ecs describe-tasks --cluster "$cluster" --tasks "$task" \
            --query 'tasks[0].[containers[0].exitCode, stoppedReason]' --output text)
          echo "--- migrate output ---"
          aws logs get-log-events --log-group-name "/ecs/gforest-${ENV_NAME}" --log-stream-name "migrate/web/${task##*/}" \
            --query 'events[].message' --output text 2>/dev/null || echo "(로그 없음)"
          echo "----------------------"
          [ "$code" = "0" ] || { echo "::error::DB 마이그레이션 실패 (exit=$code, $reason)"; exit 1; }

      - name: 태스크 정의 갱신 + 서비스 배포
        run: |
          set -euo pipefail
          family="gforest-${ENV_NAME}"
          image="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}"
          # 이미지 교체 + 배포 메타(버전·배포자·실행 URL)를 태스크 정의 env에 기록 → /version 이력의 출처
          aws ecs describe-task-definition --task-definition "$family" --query taskDefinition \
            | jq --arg img "$image" --arg ver "${{ steps.ver.outputs.version }}" --arg by "${{ github.actor }}" \
                 --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '
                .containerDefinitions[0].image = $img
                | .containerDefinitions[0].environment |= (map(select(.name | IN("APP_VERSION","APP_DEPLOYED_BY","APP_BUILD_URL") | not))
                    + [{name:"APP_VERSION",value:$ver},{name:"APP_DEPLOYED_BY",value:$by},{name:"APP_BUILD_URL",value:$url}])
                | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > td.json
          arn=$(aws ecs register-task-definition --cli-input-json file://td.json --query taskDefinition.taskDefinitionArn --output text)
          echo "task definition: $arn"
          aws ecs update-service --cluster gforest --service "$family" --task-definition "$arn" --query 'service.deployments[0].status' --output text
          aws ecs wait services-stable --cluster gforest --services "$family"

      - name: 스모크 체크 (DNS 전환 여부와 무관하게 ALB로 직접, Host 헤더로 환경 선택)
        run: |
          host="${SITE_URL#https://}"
          for i in $(seq 1 10); do
            if curl -fsSk --max-time 10 -H "Host: $host" "https://${{ vars.ALB_DNS_NAME }}/api/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::$host /api/health 응답 없음"; exit 1

      # 배포 결과 Discord 알림 — 성공/실패/취소 모두(if: always). 시크릿 DISCORD_WEBHOOK_URL 없으면 건너뜀.
      - name: Discord 알림
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          VERSION: ${{ steps.ver.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          COMMIT_MSG: ${{ github.event.head_commit.message || github.ref_name }}
        run: |
          [ -n "$WEBHOOK" ] || { echo "DISCORD_WEBHOOK_URL 없음 — 알림 생략"; exit 0; }
          case "$STATUS" in
            success) icon="✅"; color=3066993 ;;
            failure) icon="🚨"; color=15158332 ;;
            *)       icon="⚠️"; color=9807270 ;;
          esac
          title="$icon [$ENV_NAME] 배포 $STATUS — $VERSION"
          desc=$(printf '%s\n' "$COMMIT_MSG" | head -1 | cut -c1-200)
          jq -n --arg t "$title" --arg d "$desc" --arg url "$RUN_URL" --arg env "$ENV_NAME" --arg site "$SITE_URL" --arg actor "$ACTOR" --argjson c "$color" '{
            embeds: [{ title: $t, description: $d, url: $url, color: $c,
              fields: [ {name:"환경", value:$env, inline:true}, {name:"실행자", value:$actor, inline:true},
                        {name:"확인", value:($site + "/version"), inline:false} ] }] }' \
            | curl -sS -o /dev/null -w "discord %{http_code}\n" -H "Content-Type: application/json" -d @- "$WEBHOOK"
