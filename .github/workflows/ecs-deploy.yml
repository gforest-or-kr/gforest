# 컨테이너 이미지 빌드 → ECR push → ECS Fargate 배포.
#  - main push: dev 자동 배포
#  - 수동 실행(workflow_dispatch): env=prod 선택 시 prod 배포 (GitHub environment "prod" 승인 규칙 적용 가능)
# AWS 자격증명은 OIDC 롤(vars.AWS_DEPLOY_ROLE_ARN)만 사용한다. 장기 키 없음.
name: ecs-deploy

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "infra/**", "mockups/**", "*.md"]
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 환경
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecs-deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm # Fargate ARM64와 동일 아키텍처 → QEMU 없이 네이티브 빌드
    timeout-minutes: 25
    environment: ${{ inputs.environment || 'dev' }}
    env:
      ENV_NAME: ${{ inputs.environment || 'dev' }}
      SITE_URL: ${{ (inputs.environment || 'dev') == 'prod' && 'https://gforest.or.kr' || 'https://dev.gforest.or.kr' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드·push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ env.ENV_NAME }}-latest
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 태스크 정의 갱신 + 서비스 배포
        run: |
          set -euo pipefail
          family="gforest-${ENV_NAME}"
          image="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}"
          aws ecs describe-task-definition --task-definition "$family" --query taskDefinition \
            | jq --arg img "$image" '
                .containerDefinitions[0].image = $img
                | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
            > td.json
          arn=$(aws ecs register-task-definition --cli-input-json file://td.json --query taskDefinition.taskDefinitionArn --output text)
          echo "task definition: $arn"
          aws ecs update-service --cluster gforest --service "$family" --task-definition "$arn" --query 'service.deployments[0].status' --output text
          aws ecs wait services-stable --cluster gforest --services "$family"

      - name: 스모크 체크 (DNS 전환 여부와 무관하게 ALB로 직접, Host 헤더로 환경 선택)
        run: |
          host="${SITE_URL#https://}"
          for i in $(seq 1 10); do
            if curl -fsSk --max-time 10 -H "Host: $host" "https://${{ vars.ALB_DNS_NAME }}/api/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "::error::$host /api/health 응답 없음"; exit 1
